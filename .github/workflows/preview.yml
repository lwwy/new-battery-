name: Build APK

on:
  workflow_dispatch: # 手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assemblePreview

      - name: Copy arm64 APK to output
        run: |
          mkdir -p output
          # 只要把生成的目录里带 arm64 的 apk 抓过来就行了
          cp app/build/outputs/apk/preview/*arm64-v8a*.apk output/mpvEx-preview-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apks
          path: output/
